name: Feature request
description: A camera, a format feature, an API or a documentation need
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the task, not only the feature. Say what you do today instead.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the library to offer?
      description: For a new camera or format, its name and the public documentation that describes it. For an API, a short code sketch.
  - type: textarea
    id: files
    attributes:
      label: Example files
      description: A file that needs it, or the camera that writes it. Do not attach a file you are not allowed to share.
